[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.2"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Emmanue707/krapy"
authors = ["Emmanuel Kokele"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
anyhow = "1"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
qrcode = "0.14"
base64 = "0.22"
urlencoding = "2"

krapy-core = { path = "crates/krapy-core" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3