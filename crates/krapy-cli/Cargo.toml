[package]
name = "krapy-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "krapy"
path = "src/main.rs"

[[example]]
name = "fakephone"
path = "examples/fakephone.rs"

[features]
default = ["ffmpeg"]
ffmpeg = ["krapy-decode/ffmpeg"]
ffmpeg-static = ["ffmpeg", "krapy-decode/ffmpeg-static"]
openh264 = ["krapy-decode/openh264"]

[dependencies]
krapy-core = { workspace = true }
krapy-decode = { path = "../krapy-decode", default-features = false }
krapy-transport = { path = "../krapy-transport" }
krapy-render = { path = "../krapy-render" }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
qrcode = { workspace = true }
base64 = { workspace = true }
urlencoding = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
ctrlc = "3"

[dev-dependencies]
krapy-transport = { path = "../krapy-transport" }
krapy-decode = { path = "../krapy-decode" }
anyhow = { workspace = true }
rand = { workspace = true }
tempfile = "3"